[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Your AI job search copilot: finds roles, tracks applications, reads replies, and plugs into Claude Code, Codex or Gemini CLI to write tailored applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JobPilot contributors" }]
keywords = ["job search", "werkstudent", "internship", "claude code", "codex", "gemini cli", "agent skills"]
dependencies = [
  "requests>=2.28",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "python-docx>=1.0",
  "pypdf>=4.0",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
gsheets = ["gspread>=6.0", "google-auth>=2.20"]
dev = ["pytest>=7"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobpilot = ["data/*.yaml", "templates/*.md", "templates/skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
