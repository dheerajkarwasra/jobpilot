# Scoring rubric (points). High >= high_threshold, Medium >= medium_threshold.
scoring:
  english_or_language_ok: 3
  primary_keyword: 3
  core_keyword: 2
  secondary_keyword: 1
  watchlist_company: 1
  language_likely_needed: -2
  fulltime_visa_risk: -2
  consultancy: -1
  high_threshold: 6
  medium_threshold: 3
  consultancy_markers: ["consulting", "beratung", "consultant", "accenture", "capgemini", "deloitte", "pwc", "kpmg", "sopra steria", "bearingpoint", "d-fine"]
