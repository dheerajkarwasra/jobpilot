name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          jobpilot --version
          jobpilot --help

  installer:
    name: shellcheck and installer dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh
      - name: Local install from checkout
        run: |
          JOBPILOT_NO_SETUP=1 bash install.sh
          export PATH="$HOME/.local/bin:$PATH"
          jobpilot --version

  installer-windows:
    name: installer on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local install from checkout
        shell: pwsh
        run: |
          $env:JOBPILOT_NO_SETUP = "1"
          .\install.ps1
          & "$env:USERPROFILE\.jobpilot\bin\jobpilot.cmd" --version
